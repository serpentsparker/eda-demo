name: eda-demo

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eda_demo
      POSTGRES_USER: eda_user
      POSTGRES_PASSWORD: eda_pass  # pragma: allowlist secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eda_user -d eda_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,events
      DEBUG: "0"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      LOCALSTACK_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/demo-queue
      DATABASE_URL: postgresql+asyncpg://eda_user:eda_pass@postgres:5432/eda_demo  # pragma: allowlist secret
      AWS_PROFILE: default
    volumes:
      - ~/.aws:/root/.aws:ro
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      LOCALSTACK_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/demo-queue
      DATABASE_URL: postgresql+asyncpg://eda_user:eda_pass@postgres:5432/eda_demo  # pragma: allowlist secret
      AWS_PROFILE: default
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
