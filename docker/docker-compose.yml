services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,events
      DEFAULT_REGION: eu-central-1
      DEBUG: "0"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      LOCALSTACK_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/demo-queue
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      LOCALSTACK_ENDPOINT: http://localstack:4566
      CELERY_BROKER_URL: sqs://test:test@localstack:4566  # pragma: allowlist secret
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
