name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.11.8

      - name: Install dependencies
        run: cd ${{ matrix.service }} && uv sync --extra dev

      - name: Ruff lint
        run: cd ${{ matrix.service }} && uv run ruff check .

      - name: Ruff format check
        run: cd ${{ matrix.service }} && uv run ruff format --check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.11.8

      - name: Install dependencies
        run: cd ${{ matrix.service }} && uv sync --extra dev

      - name: Run unit tests
        run: cd ${{ matrix.service }} && uv run pytest -v --cov=app --cov-report=term-missing

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: ./api
          - service: worker
            context: ./worker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: eda_demo
          POSTGRES_USER: eda_user
          POSTGRES_PASSWORD: eda_pass  # pragma: allowlist secret
        options: >-
          --health-cmd "pg_isready -U eda_user -d eda_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: sqs,events
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.11.8

      - name: Install AWS CLI
        run: pip install awscli

      - name: Initialise LocalStack resources
        run: bash docker/localstack/init/01_create_resources.sh
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret
          AWS_DEFAULT_REGION: eu-central-1
          LOCALSTACK_ENDPOINT: http://localhost:4566

      - name: Install API dependencies
        run: cd api && uv sync --extra dev

      - name: Run database migrations
        run: cd api && uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://eda_user:eda_pass@localhost:5432/eda_demo  # pragma: allowlist secret

      - name: Start API
        run: cd api && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret
          AWS_DEFAULT_REGION: eu-central-1
          LOCALSTACK_ENDPOINT: http://localhost:4566
          EVENTBRIDGE_BUS_NAME: demo-event-bus
          DATABASE_URL: postgresql+asyncpg://eda_user:eda_pass@localhost:5432/eda_demo  # pragma: allowlist secret

      - name: Install worker dependencies
        run: cd worker && uv sync

      - name: Start worker
        run: cd worker && uv run python -m app.main &
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret
          AWS_DEFAULT_REGION: eu-central-1
          LOCALSTACK_ENDPOINT: http://localhost:4566
          SQS_QUEUE_URL: http://localhost:4566/000000000000/demo-queue
          DATABASE_URL: postgresql+asyncpg://eda_user:eda_pass@localhost:5432/eda_demo  # pragma: allowlist secret

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && echo "API is healthy" && exit 0
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Install integration test dependencies
        run: cd integration && uv sync

      - name: Run integration tests
        run: cd integration && uv run pytest -v
        env:
          API_BASE_URL: http://localhost:8000
