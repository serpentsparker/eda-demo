[project]
name = "eda-demo-worker"
version = "0.1.0"
description = "EDA demo — background job worker"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "boto3>=1.35.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/unit/worker"]
